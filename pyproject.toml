[project]
name = "coding-guides-server"
version = "0.1.0"
description = "MCP server serving mandatory coding guidelines for 130+ languages, frameworks, and tools"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cachetools>=7.1.7",
    "dynaconf>=3.3.5",
    "httpx>=0.28.1",
    "mcp>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/delian/codeguide-mcp"
Repository = "https://github.com/delian/codeguide-mcp"

[project.scripts]
codeguide-mcp = "coding_guides_server.server:main"

[dependency-groups]
dev = ["pre-commit>=4.6.2", "ruff>=0.16.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coding_guides_server", "config"]

# The guides, prompts, and instructions are data the server reads at runtime, so
# they must travel inside the wheel — nested under the package rather than as
# top-level directories in site-packages.
[tool.hatch.build.targets.wheel.force-include]
"guides" = "coding_guides_server/guides"
"prompts" = "coding_guides_server/prompts"
"MCP-instructions.md" = "coding_guides_server/MCP-instructions.md"
